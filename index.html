<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="login-box">

        <h1>Login</h1>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
            >

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
            >

            <button type="submit">Login</button>

        </form>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
